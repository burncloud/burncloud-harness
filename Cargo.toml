[package]
name = "burncloud-harness"
version = "0.1.0"
edition = "2021"
description = "A BurnCloud-specific harness for running coding agents inside repository-defined boundaries"
license = "MIT"
repository = "https://github.com/burncloud/burncloud-harness"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
globset = "0.4"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
