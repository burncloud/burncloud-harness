[package]
name = "burncloud-harness"
version = "0.1.0"
edition = "2024"
description = "A small, observable harness for running coding agents inside explicit goals and boundaries"
license = "Apache-2.0"
repository = "https://github.com/burncloud/burncloud-harness"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
