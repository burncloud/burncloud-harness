name: ui-migrate-01-buyer-overview-v2

goal: |
  Port the active Buyer Overview page from the approved source UI into the Rust/Dioxus
  client in burncloud/burncloud with STRICT SOURCE FIDELITY.

  SOURCE IMPLEMENTATION TRUTH:
  - Repository: rustburn/burncloud-ui
  - Pinned source commit: ce4fa9d2e79928a388bffa363a1eec77f6998900
  - Active page: src/pages/buyer/BuyerOverview.tsx
  - Shared shell: src/components/Layout.tsx
  - Active routes/aliases: /, /buyer, /buyer/overview
  - src/App.tsx is the authority for which source pages are currently reachable.
    Do not migrate obsolete generic page files that are not used by the active router.

  TARGET PRODUCT TRUTH:
  - The BurnCloud UI standards and page contract listed in context_files.
  - Product/runtime truth controls what values may be claimed as real.
  - The pinned source UI controls presentation topology: shell, Buyer navigation, major section
    order, component form, spacing/density, CTA placement, and recognizable visual hierarchy.
  - If a source demo value is not backed by BurnCloud runtime data, replace only the VALUE/STATE
    with truthful Loading / Empty / Unknown / Unavailable content. DO NOT replace the source
    component or section geometry with a legacy Console pattern or a generic warning page.

  REQUIRED VISUAL LANDMARKS:
  - Buyer-specific application shell from the source Layout, not the legacy generic Console shell.
  - Buyer navigation centered on Overview / Playground / Model Marketplace / API Keys /
    Usage Analytics / Billing & Escrow / Request Logs.
  - Source-style top header with search, status/autopilot area, language switcher, and account area.
  - Buyer Overview page header with concise subtitle and source-positioned actions.
  - Conclusion/status strip below the page header.
  - Four primary metric slots in this exact order:
      Today Spend -> Balance -> API Availability -> Tokens Today.
  - Models in Use remains a major card/table section even if confirmed rows are unavailable.
  - Recent Activity remains a major card/list section even if confirmed events are unavailable.
  - Needs Attention is conditional and must not become a permanent replacement for the source page.

  IMPLEMENTATION REQUIREMENTS:
  - When `BURN_CLOUD_UI_VISUAL_FIXTURE=aether-ce4fa9` is set, render the pinned source page's deterministic demo values and expose `data-visual-fixture="aether-ce4fa9"`; this capture-only state must never affect normal production runtime data.
  - Read docs/ui/source-migration-fidelity.md before editing and treat it as a completion rule.
  - First inspect the current Rust/Dioxus route, page implementation, shared layout/components,
    and existing data/API wiring.
  - Reproduce the source page's layout, hierarchy, controls, interaction shape, density,
    typography, spacing, states, and visual treatment closely enough that the source and Rust
    page are immediately recognizable as the same product/page.
  - Translate React/TypeScript/Tailwind patterns into idiomatic Rust/Dioxus and the existing
    BurnCloud CSS/component system. Do not add React, Vite, Node, or a second frontend runtime.
  - Preserve source i18n semantics for en, zh, zh-TW, and ja. User-visible copy must remain
    localizable. A small shared i18n module may be introduced within the declared file budget.
  - Reuse current BurnCloud backend/client data where already available. Do not change backend,
    server, service, database, dependencies, or unrelated functional pages just to obtain prettier
    demo values.
  - Do not migrate later Buyer/Supplier/Admin pages in this task.
  - Respect scope.max_changed_files. If the strict page port genuinely needs more files, report
    NEED_SCOPE_EXPANSION instead of widening the diff.
  - End with a parity report that separately lists:
      (1) source visual landmarks reproduced,
      (2) truthful data substitutions,
      (3) intentional contract-driven differences,
      (4) files changed,
      (5) verification run,
      (6) remaining visual gaps.
  - Do not claim completion while any required visual landmark above is missing.

  This is the first Golden Page. Do not optimize unrelated pages or shared systems ahead of need.

workspace: ../burncloud
area: ui
max_loops: 6

context_files:
  - ../../docs/ui/product-standard.md
  - ../../docs/ui/information-architecture.md
  - ../../docs/ui/page-contracts/buyer-overview.md
  - ../../docs/ui/design-system.md
  - ../../docs/ui/interaction-rules.md
  - ../../docs/ui/content-standard.md
  - ../../docs/ui/review-checklist.md
  - ../../docs/ui/agent-execution.md
  - ../../docs/ui/source-migration-fidelity.md
  - ../../../burncloud-ui/src/App.tsx
  - ../../../burncloud-ui/src/components/Layout.tsx
  - ../../../burncloud-ui/src/components/LanguageSwitcher.tsx
  - ../../../burncloud-ui/src/components/Logo.tsx
  - ../../../burncloud-ui/src/components/ui.tsx
  - ../../../burncloud-ui/src/context/RoleContext.tsx
  - ../../../burncloud-ui/src/data/workbenchData.ts
  - ../../../burncloud-ui/src/i18n/I18nContext.tsx
  - ../../../burncloud-ui/src/i18n/types.ts
  - ../../../burncloud-ui/src/i18n/locales/en.ts
  - ../../../burncloud-ui/src/i18n/locales/zh.ts
  - ../../../burncloud-ui/src/i18n/locales/zhTW.ts
  - ../../../burncloud-ui/src/i18n/locales/ja.ts
  - ../../../burncloud-ui/src/index.css
  - ../../../burncloud-ui/src/pages/buyer/BuyerOverview.tsx

scope:
  allowed:
    - crates/client/src/app.rs
    - crates/client/src/components.rs
    - crates/client/src/critical_pages/dashboard.rs
    - crates/client/src/functional_layout.rs
    - crates/client/src/i18n.rs
    - crates/client/src/lib.rs
    - crates/client/src/product_ui.css
    - crates/tests/tests/e2e/console_pages.rs
  avoid:
    - crates/client/Cargo.toml
    - crates/client/scripts/**
    - crates/client/src/backend.rs
    - crates/client/src/data.rs
    - crates/client/src/functional_pages/**
    - crates/client/src/route_aliases.rs
    - crates/router/**
    - crates/server/**
    - crates/service/**
    - crates/database/**
  max_changed_files: 8

agent:
  program: codex
  args:
    - exec
    - --full-auto
  append_prompt: true
  soft_timeout_minutes: 15
  hard_timeout_minutes: 25
  idle_timeout_minutes: 5

visual:
  route: /buyer/overview
  reference_url: https://aether-router.ai.studio/buyer/overview
  pixel_match:
    channel_tolerance: 0
    max_changed_pixel_ratio: 0.0
    max_mean_channel_delta: 0.0
  required_selectors:
    - '[data-visual-fixture="aether-ce4fa9"]'
    - .buyer-shell
    - .buyer-sidebar
    - .buyer-topbar
    - .buyer-overview-page
    - .buyer-page-header
    - .buyer-conclusion
    - .buyer-metrics
  metric_labels:
    - TODAY SPEND
    - PREPAID BALANCE
    - API AVAILABILITY
    - TOKENS TODAY
  section_titles:
    - Models in Use
    - Recent Activity
  clipping_selectors:
    - .buyer-page-heading
    - .buyer-page-heading h1
    - .buyer-page-heading p
    - .buyer-header-actions
    - .buyer-conclusion
    - .buyer-metric
    - .buyer-section-card
  locale_selector: '.buyer-language select[aria-label="Language"]'
  locale_title_selector: .buyer-page-heading h1
  locale_titles:
    - value: en
      title: Developer Overview
    - value: zh
      title: 开发者工作台概览
    - value: zh-TW
      title: 開發者工作台總覽
    - value: ja
      title: 開発者ダッシュボード概要
  mobile_menu:
    trigger_selector: .buyer-mobile-menu
    panel_selector: .buyer-mobile-panel
    expected_links:
      - Overview
      - Playground
      - Model Marketplace
      - API Keys
      - Usage Analytics
      - Billing & Escrow
      - Request Logs

extra_checks: []
