name: ui-migrate-03-admin-overview-v1

goal: |
  Port the active Admin Overview page from the approved source UI into the Rust/Dioxus
  client in burncloud/burncloud.

  SOURCE IMPLEMENTATION TRUTH:
  - Repository: rustburn/burncloud-ui
  - Pinned source commit: ce4fa9d2e79928a388bffa363a1eec77f6998900
  - Active page: src/pages/admin/AdminOverview.tsx
  - Active routes/aliases: /admin, /admin/overview
  - src/App.tsx is the authority for which source pages are currently reachable.
    Do not migrate obsolete generic page files that are not used by the active router.

  TARGET PRODUCT TRUTH:
  - The BurnCloud UI standards and the page contract listed in context_files.
  - If the source UI conflicts with an approved product contract, role boundary,
    truthful-state rule, security rule, or current BurnCloud runtime fact, the approved
    contract/current runtime truth wins. Record the parity gap instead of copying the conflict.

  IMPLEMENTATION REQUIREMENTS:
  - First inspect the current Rust/Dioxus route, page implementation, shared components,
    data/API wiring, and executable UI gates before editing.
  - Reproduce the source page's layout, hierarchy, controls, interaction shape, density,
    typography, spacing, states, and visual treatment as closely as practical in Dioxus.
  - Translate React/TypeScript/Tailwind patterns into idiomatic Rust/Dioxus and the existing
    BurnCloud CSS/component system. Do not add React, Vite, Node, or a second frontend runtime.
  - Reuse or minimally extend shared Rust UI primitives. Do not create a page-local duplicate
    design system.
  - Preserve source i18n behavior for en, zh, zh-TW, and ja. User-visible copy must remain
    localizable; do not hard-code English/Chinese strings when they belong in shared locale data.
  - Preserve the active source routes/aliases for this page when doing so does not conflict
    with the approved information architecture.
  - Use real BurnCloud client data/API wiring where it exists. Source demo/mock values are
    visual reference only and must never become fake runtime facts. When real data is missing,
    render truthful Loading / Empty / Unknown / Unavailable states.
  - Keep Admin mental model Supply -> Capacity -> Demand -> Economics. Do not weaken safety
    or approval boundaries for financial, settlement, capacity, or destructive operations.
  - Make the smallest coherent migration for THIS page. Shared i18n/layout/component changes
    are allowed only when required by this page and must be reusable by later migration tasks.
  - Do not redesign or migrate unrelated active pages in this task.
  - Do not change router/server/service/database behavior outside the client scope.
  - End with a parity report: source elements reproduced, intentional contract-driven
    differences, data-wiring differences, verification run, and remaining gaps.

  This task is part of the ordered UI migration program in tasks/ui/README.md.
  Do not skip ahead to later pages.

